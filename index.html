<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartCalc Hub</title>
<style>
:root{--bg:#FFFFFF;--alt:#F3F6FA;--card:#FFFFFF;--tx:#202B3C;--mu:#718096;--ac:#174EA6;--ph:#123E85;--navy:#0B1F3A;--ok:#18A874;--bd:#DDE3EB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--ac);text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--navy);border-bottom:1px solid var(--navy)}header a{color:#fff}header a:hover{text-decoration:underline}
.logo{font-weight:700;color:#fff;cursor:pointer;display:flex;gap:8px;align-items:center}
.logo b{background:#fff;color:var(--ac);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;font-size:14px}
main{max-width:1080px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:clamp(26px,5vw,38px);margin:20px 0 8px;letter-spacing:-.02em}
.sub{color:var(--mu);margin:0 0 18px}
input,select,button{font:inherit;color:var(--tx);background:#fff;border:1px solid var(--bd);border-radius:10px;padding:11px 12px;min-height:44px}
input,select{width:100%}
button{cursor:pointer;background:var(--card)}button:hover{border-color:var(--ac);background:var(--alt)}
.pill.on,.pill.on:hover{background:var(--ac);border-color:var(--ac);color:#fff}.pill.on:hover{background:var(--ph)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 2px 10px #0b1f3a14}
.card h3{margin:6px 0 4px;font-size:16px}.card p{color:var(--mu);margin:0 0 10px;font-size:13px}
.tag{font-size:11px;color:var(--ac);text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fav{min-height:36px;padding:4px 10px}
.calc{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:800px){.calc{grid-template-columns:1fr 1fr}}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.res{background:var(--alt);border:1px solid var(--bd);border-radius:14px;padding:16px}
.res div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--bd)}
.res div:last-child{border:0}.res b{color:var(--tx)}.res span{color:var(--mu)}
.res .big b{font-size:22px;color:var(--ac)}
.err{color:#B42318}
.note{color:var(--mu);font-size:13px}
footer{background:var(--alt);border-top:1px solid var(--bd);padding:20px;text-align:center;color:var(--mu);font-size:13px}
code{background:var(--alt);padding:2px 6px;border-radius:6px;display:inline-block;white-space:normal}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--ac)}}
</style></head><body>
<header><div class="logo" onclick="location.hash=''" tabindex="0" role="link"><b>&#9638;</b> SmartCalc Hub</div>
<nav><a href="#">Browse</a> &nbsp; <a href="#favs">Favorites</a></nav></header>
<main id="app"></main>
<footer>Estimates only, not financial, tax or medical advice. Inputs stay in your browser.</footer>
<script>
const $=(s,e=document)=>e.querySelector(s);
const CATS=["Finance & Money","Health & Fitness","Everyday","Business & Construction","Math & Education"];
const f2=(n,d=2)=>isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"n/a";
const $$=n=>isFinite(n)?(n<0?"-":"")+"$"+f2(Math.abs(n)):"n/a";
const pc=n=>isFinite(n)?f2(n)+"%":"n/a";
const pmt=(P,r,n)=>r?P*r/(1-Math.pow(1+r,-n)):P/n;
const ACT=[["Sedentary (1.2)",1.2],["Light (1.375)",1.375],["Moderate (1.55)",1.55],["Active (1.725)",1.725],["Very active (1.9)",1.9]];
const loanRes=(P,rate,n)=>{const m=pmt(P,rate/1200,n),t=m*n;return[["Monthly payment",$$(m),1],["Total interest",$$(t-P)],["Total repaid",$$(t)]]};
const need=(v,...k)=>k.some(x=>v[x]===""||isNaN(v[x]));
// field: [key,label,default,type,opts]; calc returns rows [label,value,big?] or string error
const C=[
{id:"mortgage-calculator",n:"Mortgage Calculator",c:0,d:"Monthly payment with tax, insurance and HOA.",k:"home loan house payment",
 f:[["price","Home price ($)",400000],["down","Down payment (%)",20],["rate","Interest rate (% APR)",6.5],["yrs","Term (years)",30],["tax","Property tax ($/yr)",4800],["ins","Insurance ($/yr)",1500],["hoa","HOA ($/month)",0]],
 fm:"M = P × r(1+r)^n / ((1+r)^n − 1); r = APR/12, n = years×12. Zero rate: M = P/n.",
 x:v=>{if(need(v,"price","down","rate","yrs","tax","ins","hoa")||v.price<=0||v.yrs<=0||v.down<0||v.down>=100||v.rate<0)return"Enter a positive price, term, 0–99% down and a non-negative rate.";
 const dp=v.price*v.down/100,P=v.price-dp,n=v.yrs*12,pi=pmt(P,v.rate/1200,n),all=pi+v.tax/12+v.ins/12+v.hoa;
 return[["Estimated total monthly",$$(all),1],["Principal & interest",$$(pi)],["Property tax (est.)",$$(v.tax/12)],["Insurance (est.)",$$(v.ins/12)],["HOA",$$(v.hoa)],["Down payment",$$(dp)],["Total interest",$$(pi*n-P)],["Total loan cost",$$(pi*n)]]}},
{id:"auto-loan-calculator",n:"Auto Loan Calculator",c:0,d:"Financed amount and monthly car payment.",k:"car vehicle",
 f:[["price","Vehicle price ($)",30000],["down","Down payment ($)",3000],["trade","Trade-in value ($)",5000],["tax","Sales tax (%)",7],["fees","Fees ($)",500],["rate","Interest rate (% APR)",6],["mo","Term (months)",60]],
 fm:"Financed = Price × (1 + tax) + Fees − Down − Trade-in. Payment uses the amortizing loan formula. Tax is applied to the full price here; some states tax after trade-in.",
 x:v=>{if(need(v,"price","down","trade","tax","fees","rate","mo")||v.mo<=0||v.rate<0)return"Check inputs: term must be positive and rate non-negative.";
 const P=v.price*(1+v.tax/100)+v.fees-v.down-v.trade;if(P<=0)return"Down payment and trade-in cover the full cost; nothing to finance.";
 const m=pmt(P,v.rate/1200,v.mo);return[["Monthly payment",$$(m),1],["Amount financed",$$(P)],["Total interest",$$(m*v.mo-P)],["Total paid",$$(m*v.mo)]]}},
{id:"loan-calculator",n:"Loan Calculator",c:0,d:"Payment, interest and total repayment for any loan.",k:"personal amortization",
 f:[["a","Loan amount ($)",15000],["r","Interest rate (% APR)",8],["y","Term (years)",3]],
 fm:"Monthly payment = P × r(1+r)^n / ((1+r)^n − 1), with r = APR/12 and n = months.",
 x:v=>need(v,"a","r","y")||v.a<=0||v.y<=0||v.r<0?"Enter a positive amount and term and a non-negative rate.":loanRes(v.a,v.r,v.y*12)},
{id:"compound-interest-calculator",n:"Compound Interest Calculator",c:0,d:"Growth of savings with regular contributions.",k:"investment savings interest",
 f:[["p","Initial deposit ($)",10000],["r","Annual rate (%)",7],["n","Compounds per year",12,"sel",[["Annually",1],["Quarterly",4],["Monthly",12],["Daily",365]]],["c","Monthly contribution ($)",200],["t","Years",20]],
 fm:"A = P(1 + r/n)^(nt). Contributions are simulated monthly, deposited at the end of each month, with interest compounded at the selected frequency (effective monthly rate = (1+r/n)^(n/12) − 1).",
 x:v=>{if(need(v,"p","r","n","c","t")||v.t<=0||v.r<0)return"Enter a positive duration and non-negative rate.";
 const mr=Math.pow(1+v.r/100/v.n,v.n/12)-1;let b=v.p;for(let i=0;i<Math.round(v.t*12);i++)b=b*(1+mr)+v.c;
 const contrib=v.p+v.c*Math.round(v.t*12);return[["Final balance",$$(b),1],["Initial principal",$$(v.p)],["Total contributions",$$(v.c*Math.round(v.t*12))],["Interest earned",$$(b-contrib)]]}},
{id:"credit-card-payoff-calculator",n:"Credit Card Payoff Calculator",c:0,d:"How long to pay off a balance and the interest cost.",k:"debt apr",
 f:[["b","Balance ($)",5000],["apr","APR (%)",22],["p","Monthly payment ($)",200]],
 fm:"Each month: interest = balance × APR/12, then the payment is applied. Months n = −ln(1 − B·r/p) / ln(1 + r).",
 x:v=>{if(need(v,"b","apr","p")||v.b<=0||v.p<=0||v.apr<0)return"Enter a positive balance and payment.";
 const r=v.apr/1200;if(v.p<=v.b*r)return"Payment is not greater than monthly interest ("+$$(v.b*r)+"). The balance will not decrease.";
 let b=v.b,m=0,ti=0;while(b>0.005&&m<1200){const i=b*r;ti+=i;b=b+i-Math.min(v.p,b+i);m++}
 const d=new Date();d.setMonth(d.getMonth()+m);return[["Months to payoff",m+" ("+f2(m/12,1)+" yrs)",1],["Total interest",$$(ti)],["Total paid",$$(v.b+ti)],["Payoff date",d.toLocaleDateString("en-US",{month:"long",year:"numeric"})]]}},
{id:"salary-to-hourly-calculator",n:"Salary-to-Hourly Calculator",c:0,d:"Convert annual salary to hourly and other pay periods.",k:"wage pay",
 f:[["s","Annual salary ($)",75000],["h","Hours per week",40],["w","Weeks per year",52]],
 fm:"Hourly = Salary ÷ (hours × weeks). Biweekly = Salary ÷ 26, semimonthly = Salary ÷ 24, monthly = Salary ÷ 12. Works for gross or take-home income.",
 x:v=>need(v,"s","h","w")||v.s<0||v.h<=0||v.w<=0?"Enter positive hours and weeks.":[["Hourly",$$(v.s/(v.h*v.w)),1],["Weekly",$$(v.s/v.w)],["Biweekly",$$(v.s/26)],["Semimonthly",$$(v.s/24)],["Monthly",$$(v.s/12)],["Annual",$$(v.s)]]},
{id:"sales-tax-calculator",n:"Sales Tax Calculator",c:0,d:"Add tax to a price or back it out of a total.",k:"vat",
 f:[["a","Amount ($)",100],["r","Tax rate (%)",8.25],["m","Amount is",0,"sel",[["Before tax",0],["Tax-inclusive",1]]]],
 fm:"Tax = Price × rate/100; Total = Price + Tax. Reverse: Pre-tax = Total ÷ (1 + rate/100).",
 x:v=>{if(need(v,"a","r")||v.a<0||v.r<0)return"Enter non-negative values.";const pre=v.m?v.a/(1+v.r/100):v.a,t=pre*v.r/100;return[["Total",$$(pre+t),1],["Pre-tax price",$$(pre)],["Tax",$$(t)]]}},
{id:"bmi-calculator",n:"BMI Calculator",c:1,d:"Body mass index with adult category.",k:"weight height health",
 f:[["u","Units",0,"sel",[["Metric (cm, kg)",0],["US (in, lb)",1]]],["h","Height",175],["w","Weight",70]],
 fm:"Metric: BMI = kg / m². US: BMI = 703 × lb / in². BMI is a screening measure, not a diagnosis; adult categories do not apply to children or teens.",
 x:v=>{if(need(v,"h","w")||v.h<=0||v.w<=0)return"Enter positive height and weight.";const b=v.u?703*v.w/v.h**2:v.w/(v.h/100)**2;
 const cat=b<18.5?"Underweight":b<25?"Healthy weight":b<30?"Overweight":"Obesity";return[["BMI",f2(b,1),1],["Adult category",cat],["Reference","<18.5 · 18.5–24.9 · 25–29.9 · 30+"]]}},
{id:"tdee-calculator",n:"TDEE & Calorie Calculator",c:1,d:"Estimate maintenance calories (Mifflin–St Jeor).",k:"calorie bmr metabolism",
 f:[["a","Age (years)",30],["s","Sex",5,"sel",[["Male",5],["Female",-161]]],["h","Height (cm)",175],["w","Weight (kg)",70],["act","Activity",1.55,"sel",ACT.map(x=>[x[0],x[1]])]],
 fm:"BMR = 10·kg + 6.25·cm − 5·age + (5 male | −161 female). TDEE = BMR × activity factor. Estimates only; individual needs vary. Not for under-18s.",
 x:v=>{if(need(v,"a","h","w")||v.a<=0||v.h<=0||v.w<=0)return"Enter positive values.";if(v.a<18)return"This equation is intended for adults (18+).";
 const b=10*v.w+6.25*v.h-5*v.a+v.s,t=b*v.act;return[["Maintenance (TDEE)",f2(t,0)+" kcal",1],["BMR",f2(b,0)+" kcal"],["Gentle loss (−10%)",f2(t*.9,0)+" kcal"],["Gentle gain (+10%)",f2(t*1.1,0)+" kcal"]]}},
{id:"percentage-calculator",n:"Percentage Calculator",c:2,d:"Percent of, percent of total and percent change.",k:"percent increase decrease",
 f:[["x","X",20],["y","Y",150]],
 fm:"X% of Y = X/100 × Y · X is what % of Y = X/Y × 100 · Change from X to Y = (Y−X)/|X| × 100.",
 x:v=>{if(need(v,"x","y"))return"Enter both numbers.";return[[v.x+"% of "+v.y,f2(v.x/100*v.y,4).replace(/\.?0+$/,""),1],[v.x+" is what % of "+v.y,v.y?pc(v.x/v.y*100):"undefined (Y is 0)"],["Change from "+v.x+" to "+v.y,v.x?pc((v.y-v.x)/Math.abs(v.x)*100):"undefined (X is 0)"]]}},
{id:"discount-calculator",n:"Discount Calculator",c:2,d:"Sale price with stacked discounts and tax.",k:"sale coupon savings",
 f:[["p","Original price ($)",80],["d1","Discount (%)",25],["d2","Extra discount (%)",10],["t","Sales tax (%)",8]],
 fm:"Discounts apply sequentially: Price × (1 − d1) × (1 − d2), not added together. Tax is applied to the discounted price.",
 x:v=>{if(need(v,"p","d1","d2","t")||v.p<0||v.d1<0||v.d1>100||v.d2<0||v.d2>100)return"Discounts must be 0–100%.";const a=v.p*(1-v.d1/100),b=a*(1-v.d2/100);
 return[["Final price",$$(b),1],["Total savings",$$(v.p-b)],["After first discount",$$(a)],["Checkout total with tax",$$(b*(1+v.t/100))]]}},
{id:"tip-calculator",n:"Tip Calculator",c:2,d:"Tip and split a bill per person.",k:"restaurant split",
 f:[["b","Bill ($)",85],["t","Tip (%)",18],["n","People",3]],
 fm:"Tip = Bill × tip%; Total = Bill + Tip; Per person = Total ÷ people. Enter the pre-tax bill if you tip before tax.",
 x:v=>{if(need(v,"b","t","n")||v.b<0||v.t<0||v.n<1)return"Enter a bill, tip and at least 1 person.";const tip=v.b*v.t/100;return[["Total per person",$$((v.b+tip)/v.n),1],["Tip per person",$$(tip/v.n)],["Tip total",$$(tip)],["Bill total",$$(v.b+tip)]]}},
{id:"age-calculator",n:"Age Calculator",c:2,d:"Exact age in years, months and days.",k:"birthday date of birth",
 f:[["dob","Date of birth","1990-06-15","date"],["ref","Reference date",new Date().toISOString().slice(0,10),"date"]],
 fm:"Calendar subtraction with month borrowing (using the real length of the previous month); leap years are handled by the Date object.",
 x:v=>{if(!v.dob||!v.ref)return"Enter both dates.";const a=new Date(v.dob+"T00:00"),b=new Date(v.ref+"T00:00");if(a>b)return"Birth date must be on or before the reference date.";
 let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}
 let nb=new Date(b.getFullYear(),a.getMonth(),a.getDate());if(nb<=b)nb=new Date(b.getFullYear()+1,a.getMonth(),a.getDate());
 return[["Age",y+"y "+m+"m "+d+"d",1],["Total days",f2(Math.round((b-a)/864e5),0)],["Next birthday",nb.toDateString()],["Days until",Math.round((nb-b)/864e5)+""]]}},
{id:"profit-margin-calculator",n:"Profit Margin Calculator",c:3,d:"Gross and net margin versus markup.",k:"markup business profit",
 f:[["r","Revenue ($)",1000],["c","Cost of goods sold ($)",600],["o","Operating expenses ($)",150]],
 fm:"Gross profit = Revenue − COGS. Gross margin = Gross profit ÷ Revenue × 100. Net profit = Revenue − COGS − Opex. Markup = Gross profit ÷ COGS × 100 (not the same as margin).",
 x:v=>{if(need(v,"r","c","o")||v.r<=0||v.c<0||v.o<0)return"Revenue must be positive; costs non-negative.";const g=v.r-v.c,n=g-v.o;
 return[["Gross margin",pc(g/v.r*100),1],["Gross profit",$$(g)],["Net profit",$$(n)],["Net margin",pc(n/v.r*100)],["Markup",v.c?pc(g/v.c*100):"undefined (cost is 0)"]]}},
{id:"roi-calculator",n:"ROI Calculator",c:3,d:"Return on investment and annualized ROI.",k:"return investment",
 f:[["i","Initial investment ($)",10000],["f","Final value / proceeds ($)",13500],["x","Additional costs ($)",200],["y","Holding period (years, optional)",3]],
 fm:"Net profit = Proceeds − Initial − Additional costs. ROI = Net profit ÷ (Initial + Additional costs) × 100. Annualized = (1 + ROI)^(1/years) − 1.",
 x:v=>{if(need(v,"i","f","x")||v.i<=0)return"Initial investment must be positive.";const cost=v.i+v.x,n=v.f-cost,roi=n/cost;
 const rows=[["ROI",pc(roi*100),1],["Net profit/loss",$$(n)],["Total costs",$$(cost)]];if(v.y>0&&1+roi>0)rows.push(["Annualized ROI",pc((Math.pow(1+roi,1/v.y)-1)*100)]);return rows}},
{id:"income-tax-calculator",n:"Income Tax Calculator",c:0,d:"Illustrative US federal tax estimate (2024 brackets).",k:"federal take-home",
 f:[["s","Filing status",0,"sel",[["Single",0],["Married filing jointly",1],["Head of household",2]]],["i","Annual income ($)",85000],["a","Additional income ($)",0],["adj","Adjustments, e.g. 401(k) ($)",0],["ded","Deductions ($, 0 = standard)",0]],
 fm:"Illustrative estimate using 2024 US federal brackets and standard deductions (kept in the TAX data object). Taxable = income + additional − adjustments − deduction; tax is summed per bracket. Federal income tax only: no FICA, state or credits. Verify current-year figures; not tax advice.",
 x:v=>{if(need(v,"i","a","adj","ded")||v.i<0)return"Enter non-negative income.";const T={std:[14600,29200,21900],R:[.1,.12,.22,.24,.32,.35,.37],th:[[11600,47150,100525,191950,243725,609350,Infinity],[23200,94300,201050,383900,487450,731200,Infinity],[16550,63100,100500,191950,243700,609350,Infinity]]};
 const g=v.i+v.a,ti=Math.max(0,g-v.adj-(v.ded>0?v.ded:T.std[v.s]));let t=0,p=0;T.th[v.s].forEach((u,k)=>{if(ti>p)t+=(Math.min(ti,u)-p)*T.R[k];p=u});
 return[["Estimated federal tax",$$(t),1],["Taxable income",$$(ti)],["Effective rate (on gross)",g?pc(t/g*100):"n/a"],["Take-home (after federal tax)",$$(g-t)],["Monthly take-home",$$((g-t)/12)]]}},
{id:"budget-calculator",n:"Budget Calculator",c:0,d:"Track spending and compare with the 50/30/20 guideline.",k:"expenses savings",
 f:[["inc","Monthly after-tax income ($)",5000],["h","Housing",1500],["u","Utilities",200],["f","Food",600],["t","Transportation",300],["ins","Insurance",200],["debt","Debt payments",250],["e","Entertainment",300],["sav","Savings",500],["cu","Custom expenses (one per line: name, amount)","Gym, 40\nSubscriptions, 25","txt"]],
 fm:"Remaining = Income − Expenses. Savings rate = Savings ÷ Income. 50/30/20 is a rough guideline: needs (housing, utilities, food, transport, insurance, debt) 50%, wants (entertainment, custom) 30%, savings 20%. A suggestion, not financial advice.",
 x:v=>{if(need(v,"inc","h","u","f","t","ins","debt","e","sav")||v.inc<=0)return"Enter a positive income and numeric amounts.";let cu=0;for(const l of v.cu.split("\n").filter(x=>x.trim())){const a=+l.split(",")[1];if(isNaN(a))return"Custom line needs the form: name, amount";cu+=a}
 const nd=v.h+v.u+v.f+v.t+v.ins+v.debt,w=v.e+cu,tot=nd+w+v.sav;return[["Remaining balance",$$(v.inc-tot),1],["Total expenses",$$(tot)],["Savings rate",pc(v.sav/v.inc*100)],["Needs (actual / 50%)",$$(nd)+" / "+$$(v.inc*.5)],["Wants (actual / 30%)",$$(w)+" / "+$$(v.inc*.3)],["Savings (actual / 20%)",$$(v.sav)+" / "+$$(v.inc*.2)]]}},
{id:"retirement-calculator",n:"Retirement Calculator",c:0,d:"Project savings growth to your retirement age.",k:"401k pension nest egg",
 f:[["a","Current age",35],["ra","Retirement age",65],["s","Current savings ($)",50000],["m","Monthly contribution ($)",800],["r","Expected annual return (%)",6],["inf","Inflation (%, optional)",2.5]],
 fm:"Monthly simulation: balance = balance × (1 + r/12) + contribution (end of month). Today’s dollars = balance ÷ (1 + inflation)^years. Returns are assumptions, not guarantees.",
 x:v=>{if(need(v,"a","ra","s","m","r","inf")||v.s<0||v.m<0)return"Check inputs.";if(v.ra<=v.a)return"Retirement age must be greater than current age.";const n=Math.round((v.ra-v.a)*12);let b=v.s;for(let i=0;i<n;i++)b=b*(1+v.r/1200)+v.m;const c=v.s+v.m*n;
 return[["Projected balance",$$(b),1],["Total contributions",$$(c)],["Investment growth",$$(b-c)],["In today’s dollars",$$(b/Math.pow(1+v.inf/100,n/12))]]}},
{id:"calorie-calculator",n:"Calorie Calculator",c:1,d:"Daily calorie target for your goal (Mifflin–St Jeor).",k:"diet weight loss gain",
 f:[["a","Age (years)",30],["s","Sex",5,"sel",[["Male",5],["Female",-161]]],["h","Height (cm)",175],["w","Weight (kg)",70],["act","Activity",1.55,"sel",ACT],["g","Goal",0,"sel",[["Lose ~0.5 kg/week",-500],["Lose ~0.25 kg/week",-250],["Maintain",0],["Gain ~0.25 kg/week",250]]]],
 fm:"BMR = 10·kg + 6.25·cm − 5·age + (5 | −161). Maintenance = BMR × activity. Target = maintenance + goal adjustment (~7,700 kcal ≈ 1 kg). Estimates only; adults 18+; consult a professional.",

 rec=[c.id,...rec.filter(x=>x!==c.id)].slice(0,8);save();document.title=c.n+" | SmartCalc Hub";
 const fields=c.f.map(([k,l,d,t,o])=>t==="sel"?`<label for="${k}">${l}</label><select id="${k}">${o.map(([n,v])=>`<option value="${v}" ${v==d?"selected":""}>${n}</option>`).join("")}</select>`
 :t==="txt"?`<label for="${k}">${l}</label><textarea id="${k}" rows="6" style="width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px">${d}</textarea>`:`<label for="${k}">${l}</label><input id="${k}" ${t==="date"||t==="time"?`type="${t}"`:t==="s"?'type="text"':'type="number" step="any" inputmode="decimal"'} value="${d}">`).join("");
 $("#app").innerHTML=`<p class="note"><a href="#">Home</a> › ${CATS[c.c]} › ${c.n}</p><h1>${c.n}</h1><p class="sub">${c.d}</p>
 <div class="calc"><div class="card"><div>${fields}</div><div class="pills"><button id="reset">Reset</button><button id="copy">Copy results</button><button id="share">Share</button></div></div>
 <div><div class="res" id="out" aria-live="polite"></div></div></div>
 <div class="card" style="margin-top:18px"><h3>Formula &amp; assumptions</h3><p><code>${c.fm}</code></p><p class="note">Results are estimates based on the inputs and assumptions above, not professional advice.</p></div>
 <h2>Related calculators</h2><div class="grid">${C.filter(x=>x.c===c.c&&x!==c).slice(0,3).map(card).join("")}</div>`;
 const read=()=>{const v={};c.f.forEach(([k,,,t])=>{const e=$("#"+k);v[k]=["date","time","txt","s"].includes(t)?e.value:e.value===""?"":+e.value});return v};
 let txt="";
 const run=()=>{const r=c.x(read());if(typeof r==="string"){txt="";$("#out").innerHTML=`<p class="err">${r}</p>`;return}
 txt=c.n+"\n"+r.map(x=>x[0]+": "+x[1]).join("\n");$("#out").innerHTML=r.map(x=>`<div class="${x[2]?"big":""}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")};
 c.f.forEach(([k])=>{$("#"+k).oninput=run;$("#"+k).onchange=run});run();
 $("#reset").onclick=()=>{c.f.forEach(([k,,d])=>$("#"+k).value=d);run()};
 const flash=(id,m)=>{const b=$(id),o=b.textContent;b.textContent=m;setTimeout(()=>b.textContent=o,1500)};
 $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(txt);flash("#copy","Copied!")}catch(e){const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");flash("#copy","Copied!")}catch(_){flash("#copy","Copy failed")}t.remove()}};
 $("#share").onclick=async()=>{try{if(navigator.share)await navigator.share({title:c.n,text:txt,url:location.href});else{await navigator.clipboard.writeText(location.href);flash("#share","Link copied")}}catch(e){flash("#share","Unavailable")}};
}
function route(){const h=location.hash.slice(1);window.scrollTo(0,0);document.title="SmartCalc Hub";
 const c=C.find(x=>x.id===h);if(c)page(c);else if(h==="favs")home(true);else if(!h||h==="all")home(false);else $("#app").innerHTML=`<h1>Page not found</h1><p class="sub">That calculator does not exist.</p><a href="#">Back to all calculators</a>`}
window.addEventListener("hashchange",route);route();
</script></body></html>
